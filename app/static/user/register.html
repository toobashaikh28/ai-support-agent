<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-screen">
    <div class="card auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Sign up to chat with support.</p>

      <form id="register-form">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name">

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">

        <button type="submit" class="btn-primary" id="submit-btn">Create account</button>
        <div class="error-text" id="error-text"></div>
      </form>

      <div class="switch-link">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
